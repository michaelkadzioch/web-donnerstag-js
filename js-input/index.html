<!DOCTYPE html>
<html>

<head>
    <title>Webseite mit JS</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>

<body>
    <h1>Webseite mit JS</h1>


    <input id="eingabefeld" class="inputbox" type="text" placeholder="Hier Text eintippen">

    <input id="colorpicker" type="color">

    <br><br>

    <input type="radio" id="radio-klein" name="auswahl">
    <label for="radio-klein">ich kann gut lesen</label><br>

    <input type="radio" id="radio-mittel" name="auswahl" checked>
    <label for="radio-mittel">normal bitte</label><br>

    <input type="radio" id="radio-gross" name="auswahl">
    <label for="radio-gross">ich bin blind</label><br>
    

    <div id="btn" class="btn">Senden</div>

    <div id="js-output" class="outputbox"></div>

    <script src="js/script.js"></script>
</body>

</html>
